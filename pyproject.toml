[project]
name = "music-analytics-api"
version = "0.1.0"
description = "API REST en Flask para analítica musical sobre la base de datos Chinook."
readme = "README.md"
authors = [
    { name = "Felipe Zambrano", email = "felipe.zambrano@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cachelib>=0.17.0",
    "flask>=3.1.3",
    "flask-session>=0.8.0",
    "pydantic>=2.14.3",
]

[project.scripts]
music-analytics-api = "music_analytics_api:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff.lint.isort]
# The flask_session/ directory (session files) makes ruff treat the package as first-party.
known-third-party = ["flask_session"]
